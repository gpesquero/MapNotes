<svg xmlns="http://w3.org" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Subtle Map Grid Pattern -->
    <pattern id="mapGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#334155" stroke-width="1" opacity="0.4" />
      <circle cx="64" cy="64" r="2" fill="#475569" opacity="0.5" />
    </pattern>

    <!-- Accent Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1024" height="500" fill="url(#bgGrad)" />
  <rect width="1024" height="500" fill="url(#mapGrid)" />

  <!-- Decorative Abstract Map Route Line -->
  <path d="M -50 380 Q 250 340, 420 250 T 1080 120" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.25" />

  <!-- Centered Icon + Text Group -->
  <g transform="translate(512, 250)">
    <!-- Map Pin Icon -->
    <g transform="translate(-235, -48)">
      <path d="M40 0 C17.9 0 0 17.9 0 40 C0 68 40 104 40 104 C40 104 80 68 80 40 C80 17.9 62.1 0 40 0 Z" fill="url(#pinGrad)" />
      <circle cx="40" cy="38" r="15" fill="#0f172a" />
    </g>

    <!-- "MapNotes" Typography -->
    <text x="-130" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-1.5" fill="#f8fafc">
      Map<tspan fill="#38bdf8">Notes</tspan>
    </text>
  </g>
</svg>
